<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027" />
      <stop offset="50%" stop-color="#203A43" />
      <stop offset="100%" stop-color="#2C5364" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.1)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)" />
  
  <!-- Football Field Lines motif -->
  <g stroke="rgba(255,255,255,0.1)" stroke-width="4" fill="none">
    <!-- Center circle -->
    <circle cx="600" cy="300" r="150" />
    <!-- Center line -->
    <line x1="600" y1="0" x2="600" y2="600" />
    <!-- Penalty areas -->
    <rect x="-100" y="150" width="250" height="300" />
    <rect x="1050" y="150" width="250" height="300" />
  </g>

  <!-- Title Section -->
  <text x="100" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" fill="#ffffff" letter-spacing="-2">World Cup</text>
  <text x="100" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" fill="#FFD700" letter-spacing="-2">Prediction App</text>
  
  <text x="100" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="rgba(255,255,255,0.8)" font-weight="400">Host your own tournament prediction league.</text>
  <text x="100" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="rgba(255,255,255,0.8)" font-weight="400">Powered by React, Vite, and Firebase.</text>
  
  <!-- UI Mockup -->
  <g transform="translate(680, 150)">
    <rect width="450" height="320" rx="20" fill="url(#cardBg)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <text x="30" y="50" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#fff" opacity="0.6">LIVE LEADERBOARD</text>
    
    <!-- User Row 1 -->
    <rect x="30" y="80" width="390" height="60" rx="10" fill="rgba(255,215,0,0.1)" stroke="#FFD700" stroke-width="1"/>
    <text x="50" y="117" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#FFD700">1</text>
    <text x="90" y="116" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#fff">Alex Turner</text>
    <text x="360" y="116" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#FFD700">145 pts</text>

    <!-- User Row 2 -->
    <rect x="30" y="155" width="390" height="60" rx="10" fill="rgba(255,255,255,0.05)"/>
    <text x="50" y="192" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="rgba(255,255,255,0.6)">2</text>
    <text x="90" y="191" font-family="system-ui, sans-serif" font-size="20" font-weight="500" fill="#fff">Sarah Connor</text>
    <text x="360" y="191" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.9)">132 pts</text>

    <!-- User Row 3 -->
    <rect x="30" y="230" width="390" height="60" rx="10" fill="rgba(255,255,255,0.05)"/>
    <text x="50" y="267" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="rgba(255,255,255,0.6)">3</text>
    <text x="90" y="266" font-family="system-ui, sans-serif" font-size="20" font-weight="500" fill="#fff">John Doe</text>
    <text x="360" y="266" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="rgba(255,255,255,0.9)">110 pts</text>
  </g>
</svg>
